    <section class="section medium">
      <div class="wrap"><div class="content">
        <div class="block text-center"><h2>About Us</h2></div>
          <div class="block spacer" aria-hidden="true"></div>
          <div class="block">
            <figure class="figure collage">
              <div class="media"><img src="../images/about-1.jpg" alt="Communication towers on top of a green hillside" width="1800" height="1144" loading="lazy"></div>
              <figcaption class="card">
                <div class="title"></div>
                <div class="sub"><p>At the core of our business model is quality management, coordinating wide-scale projects across the nation. Our use of unique database management software allows us to deliver results to our clients in real-time.</p><p>We provide logistics and execute equipment removals for&nbsp;major telecommunications carriers and their partners.&nbsp;This includes, but is not limited to,&nbsp;equipment deinstallation and cable mining, including BTS, switch, RF and power cable, PBU, battery, ancillary materials extraction and removal services from cell and switch sites.</p><p>ABA Ventures&rsquo; expertise in&nbsp;process management, documentation, safety, enforcement, security, and overall systemic coverage amongst its&nbsp;management teams raises the bar in terms of quality control in the industry.</p></div>
              </figcaption>
            </figure>
          </div>
          <div class="block spacer" aria-hidden="true"></div>
          <div class="block">
            <figure class="figure collage flip">
              <div class="media"><img src="../images/about-personnel.jpg" alt="Crew members in hard hats and safety vests at a construction site" width="1800" height="1200" loading="lazy"></div>
              <figcaption class="card">
                <div class="title"><h3><strong>Highly trained personnel</strong></h3></div>
                <div class="sub"><p>Our in-house crews have comprehensive training&nbsp;in both the technical aspect of our work as well as in the importance of safety awareness. Certifications obtained by our employees&nbsp;include:</p><ul class="bullets"><li><p>OSHA 10 Hour Course</p></li><li><p>OSHA 30 Hour Course</p></li><li><p>RF Safety Awareness course</p></li><li><p>CPR/First Aid Training</p></li><li><p>Verizon Air 21-32 Swap Course</p></li></ul></div>
              </figcaption>
            </figure>
          </div>
      </div></div>
    </section>

    <section class="section medium">
      <div class="wrap"><div class="content">
          <div class="block">
            <figure class="figure collage">
              <div class="media"><img src="../images/about-safety.jpg" alt="CPR training on a practice mannequin" width="1800" height="1350" loading="lazy"></div>
              <figcaption class="card">
                <div class="title"><h3><strong>Safety</strong></h3></div>
                <div class="sub"><p>We hold our employees and crew members to the highest standards and best practices, as established by Federal and State laws, industry certification and oversight groups, and company policies. We reinforce the importance of upholding the highest level of safety awareness and hazard recognition on work sites. We have implemented a system of policy communication, awareness training, continuing education, inspections, audits, and proper documentation to ensure full compliance with our company&rsquo;s high standards.</p></div>
              </figcaption>
